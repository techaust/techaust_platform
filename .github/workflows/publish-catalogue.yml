name: Publish catalogue

# ADM-CAT-05 (owner decision 2026-10-25): when the owner publishes the catalogue in the admin, the STAGING website is rebuilt from the new
# snapshot within about 30 minutes, with no new secret. Every 30 minutes this reads the newest snapshot's SHA from the staging D1 (a read
# with the existing staging token). If a cache entry `catalogue-<sha>` says that snapshot was already deployed, it stops. Otherwise it
# builds the website with the snapshot, deploys the WEB Worker only (`--env staging`), and the cache entry is saved when the job ends
# successfully. A failed deploy saves nothing, so the next check tries again.
# Production follows the normal approved deploy (deploy-prod.yml, owner-approved), never this workflow.
# Notes: GitHub removes a cache entry nobody used for 7 days, which only means one harmless re-deploy of the same snapshot. GitHub pauses
# scheduled workflows after 60 days without repository activity (a run of "workflow_dispatch" by hand also works).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Shared with deploy-staging, so the two never deploy the web Worker at the same time.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  publish:
    # Only this repository's main branch; schedules never run for forks, and a manual run must be on main.
    if: github.repository == 'techaust/techaust_platform' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Cloudflare credentials are set only on the steps that use them, so the install step never sees them.
    steps:
      - name: Check staging credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Staging secrets not configured yet; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # Reads the newest snapshot (read-only) and writes apps/web/catalogue-snapshot.json. Outputs: found, sha.
      - if: steps.creds.outputs.ready == 'true'
        name: Fetch the published catalogue snapshot
        id: snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/fetch-catalogue-snapshot.mjs --out apps/web/catalogue-snapshot.json --github-output "$GITHUB_OUTPUT"
      # An exact-key lookup. A hit means this snapshot is already on staging. On a miss, the post step of this action saves
      # `.catalogue-published/sha.txt` under the key when the job succeeds (the file is written after the deploy, below).
      # TODO(lead): pin this action to a full commit SHA like every other action (tools check: packages/core/test/workflows.test.ts).
      - if: steps.creds.outputs.ready == 'true' && steps.snapshot.outputs.found == 'true'
        id: deployed
        uses: actions/cache@PIN_THE_FULL_COMMIT_SHA # v4
        with:
          path: .catalogue-published
          key: catalogue-${{ steps.snapshot.outputs.sha }}
      - if: steps.creds.outputs.ready == 'true' && steps.snapshot.outputs.found == 'true' && steps.deployed.outputs.cache-hit != 'true'
        name: Build and deploy the web Worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @techaust/web run deploy:staging
          mkdir -p .catalogue-published
          echo "${{ steps.snapshot.outputs.sha }}" > .catalogue-published/sha.txt
      - if: steps.creds.outputs.ready == 'true' && steps.deployed.outputs.cache-hit == 'true'
        run: echo "Snapshot ${{ steps.snapshot.outputs.sha }} is already on staging; nothing to do."
