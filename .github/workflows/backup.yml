name: Backup D1 to S3
# Nightly encrypted, off-site copy of the production D1 (docs/08-security-compliance.md §6; P7-N, docs/runs/p7-launch.md; owner 2026-11-07: "Nightly
# backups before launch"). Restore: docs/runbooks/restore.md §3.
#   1. the owner-only guard (as deploy-prod.yml): a scheduled first attempt passes, any run by hand or re-run must be techaust's;
#   2. wrangler alone, from the lockfile (as deploy-prod.yml's deploy job): no package code runs where the backup token is;
#   3. every variable and secret checked first, by name, so a missing one fails before anything is exported;
#   4. `wrangler d1 export DB --remote --env production` into $RUNNER_TEMP. Its output goes to a file that is never printed whole: wrangler logs a
#      one-hour signed download link of the PLAINTEXT dump, and this repository's Actions logs are public;
#   5. the OpenSSL envelope (scripts/backup-encrypt.sh): AES-256 under a random key, the key wrapped with the owner's RSA-4096 public key (the repo
#      variable BACKUP_PUBLIC_KEY_PEM; the private key never leaves the owner's offline folder), one .tar with a manifest;
#   6. AWS by GitHub OIDC (no AWS key stored anywhere; after the export, so wrangler never runs with AWS credentials), and the monthly decision below;
#   7. the plaintext deleted at once after the last encryption (also when a step before failed);
#   8. `aws s3 cp` to s3://<BACKUP_BUCKET>/daily/, then the object's size checked with list-objects-v2 (the role has ListBucket on daily/ and monthly/
#      only, and no GetObject). The lifecycle rule removes daily/ copies 90 days after the upload (restore.md §3.1).
# The monthly finance-only copy (P7 ops, docs/runs/p7-ops.md; PRD JOB-BKP-01; owner 2026-10-07; T7 F1), on the 1st of each month (the run's UTC day),
# when the owner starts a run with `monthly` ticked, and on any night when nothing under monthly/techaust-prod-finance-<YYYY-MM> (the run's UTC month)
# is listed yet, so a missed or failed 1st is caught up: before the plaintext is deleted, scripts/backup-monthly.mjs builds ON THE RUNNER the
# finance-only SQL (the tables and rows packages/db/src/backup-scope.ts keeps: the invoice family, accepted offers, payments, the ledger, the finance
# audit rows without IP or browser, the contract records; never leads, contacts, proposals or estimates). Same envelope; uploaded to
# s3://<BACKUP_BUCKET>/monthly/techaust-prod-finance-<YYYY-MM>-<YYYYMMDDTHHMMSSZ>.tar (the run's UTC time: a second copy in a month never replaces one)
# and checked the same way; the lifecycle rule on monthly/ keeps it 10 years. A failed monthly copy never costs the night's daily copy: the daily one
# is still uploaded, then the run fails and says why. Restore: restore.md §3.6.
# No plaintext, key or archive ever goes into an artifact, a cache or the log.
on:
  schedule:
    # 21:10 UTC = 02:40 IST: clear of the jobs Worker's :30 hourly tick and its 22:00 UTC run (P7 re-check L1), because a remote export
    # makes the database unavailable while it runs. The clearance holds only for a start within about 15 minutes of the scheduled time;
    # a later start can overlap a tick (its queue work retries).
    - cron: "10 21 * * *"
    # Two later tries, 23:10 and 01:10 UTC (04:40 and 06:40 IST): GitHub starts scheduled runs late or drops them under load (the first
    # production night's 21:10 run had not started an hour later; owner 2026-11-08). The `gate` job skips a try once a run since the
    # night began (20:30 UTC) uploaded and checked its daily copy, so one night makes one daily copy.
    # Kept (review 2026-11-08, finding 6): a run by hand or a re-run started from 20:30 UTC (02:00 IST) also counts as that night's copy.
    - cron: "10 23 * * *"
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      monthly:
        description: "Also make the monthly finance-only copy (kept 10 years). Scheduled runs make it on the 1st of each month anyway."
        type: boolean
        default: false

# Nothing at the workflow level: each job asks for its own (the backup for OIDC, the gate to read this workflow's runs).
permissions: {}

concurrency:
  group: backup-production
  cancel-in-progress: false

jobs:
  # The gate finds this job by its id `backup` and its step "Check the uploaded object": never give the job a `name:` or rename that
  # step without changing the gate (a test holds both).
  backup:
    needs: gate
    # Skipped only on the gate's clear "false": a gate that failed or said nothing still backs up (never a missed night).
    if: ${{ !cancelled() && needs.gate.outputs.run != 'false' }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    # The `backup` environment holds the secret CF_API_TOKEN_BACKUP (D1 only). CLOUDFLARE_ACCOUNT_ID is the repository secret the deploys use.
    environment: backup
    timeout-minutes: 30
    steps:
      # Only the owner (techaust) may start this by hand or re-run it (owner, 2026-10-29), as in deploy-prod.yml. A scheduled run's
      # first attempt is GitHub's own and always passes; a re-run of it must come from the owner.
      - name: Who started this run
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          case "$EVENT" in
            schedule) [ "$ATTEMPT" = "1" ] || [ "$TRIGGERING_ACTOR" = "techaust" ] ;;
            *) [ "$ACTOR" = "techaust" ] && [ "$TRIGGERING_ACTOR" = "techaust" ] ;;
          esac || { echo "Only the owner (techaust) may start or re-run this workflow."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Wrangler alone, from the lockfile (no secret in this step).
      - name: Install wrangler only
        run: pnpm install --frozen-lockfile --filter @techaust/deploy-tools
      - name: Check the backup settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_BACKUP_ROLE_ARN: ${{ vars.AWS_BACKUP_ROLE_ARN }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
          BACKUP_PUBLIC_KEY_PEM: ${{ vars.BACKUP_PUBLIC_KEY_PEM }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CF_API_TOKEN_BACKUP (secret, environment backup);"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID (repository secret);"
          [ -n "$AWS_BACKUP_ROLE_ARN" ] || missing="$missing AWS_BACKUP_ROLE_ARN (variable);"
          [ -n "$BACKUP_BUCKET" ] || missing="$missing BACKUP_BUCKET (variable);"
          [ -n "$BACKUP_PUBLIC_KEY_PEM" ] || missing="$missing BACKUP_PUBLIC_KEY_PEM (variable);"
          if [ -n "$missing" ]; then
            echo "::error::Not set:$missing nothing was exported or uploaded."
            exit 1
          fi
          case "$BACKUP_PUBLIC_KEY_PEM" in
            "-----BEGIN PUBLIC KEY-----"*) ;;
            *) echo "::error::BACKUP_PUBLIC_KEY_PEM is not a PEM public key (it must start with -----BEGIN PUBLIC KEY-----); nothing was exported."; exit 1 ;;
          esac
          printf '%s\n' "$BACKUP_PUBLIC_KEY_PEM" > "$RUNNER_TEMP/backup-public.pem"
          echo "Backup settings present."
      # The export. Wrangler's output goes to a private file: it holds a signed link to the plaintext dump, so only its lines without a link are
      # printed, and only on failure. WRANGLER_LOG_PATH keeps wrangler's own debug log in $RUNNER_TEMP too; both are deleted.
      - name: Export the production D1
        working-directory: apps/jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_BACKUP }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          umask 077
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dump="$RUNNER_TEMP/techaust-prod-$stamp.sql"
          log="$RUNNER_TEMP/wrangler-export.log"
          export WRANGLER_LOG_PATH="$RUNNER_TEMP/wrangler-logs"
          status=0
          node ../../tools/deploy/node_modules/wrangler/bin/wrangler.js d1 export DB --remote --env production --skip-confirmation --output "$dump" > "$log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::wrangler d1 export failed (exit $status). Its output without links:"
            sed -E 's#https?://[^[:space:]]+#<link removed>#g' "$log"
          fi
          rm -rf -- "$log" "$WRANGLER_LOG_PATH"
          [ "$status" -eq 0 ] || exit 1
          if [ ! -s "$dump" ]; then
            echo "::error::The export is missing or empty; nothing was uploaded."
            exit 1
          fi
          echo "DUMP=$dump" >> "$GITHUB_ENV"
          echo "ARCHIVE=$RUNNER_TEMP/techaust-prod-$stamp.tar" >> "$GITHUB_ENV"
          echo "OBJECT=daily/techaust-prod-$stamp.tar" >> "$GITHUB_ENV"
          echo "Exported $(wc -c < "$dump" | tr -d ' ') bytes."
      - name: Encrypt the export
        run: bash scripts/backup-encrypt.sh "$DUMP" "$RUNNER_TEMP/backup-public.pem" "$ARCHIVE"
      # AWS by GitHub OIDC, here (after the export, so wrangler never runs with AWS credentials): the monthly decision below lists monthly/.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BACKUP_ROLE_ARN }}
          aws-region: ap-south-1
          role-session-name: techaust-backup-${{ github.run_id }}
          mask-aws-account-id: true
      # The monthly copy, its names fixed here once from one reading of the clock. It is made on the 1st of the month (the run's UTC day, any trigger),
      # when the owner ticks `monthly`, or when nothing under monthly/techaust-prod-finance-<YYYY-MM> is listed yet (catch-up, P7 ops review M1: a missed
      # or failed 1st is made up on the next night). Each copy's name carries the run's UTC time, so a second copy in a month never replaces one. A
      # listing that fails makes the copy anyway (never a missed month), with a warning.
      - name: Is this run also the monthly copy
        id: when
        env:
          MONTHLY_INPUT: ${{ inputs.monthly }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          month="${stamp:0:4}-${stamp:4:2}"
          reason=""
          if [ "${stamp:6:2}" = "01" ]; then
            reason="the 1st of the month"
          elif [ "$MONTHLY_INPUT" = "true" ]; then
            reason="monthly ticked"
          elif listed="$(aws s3api list-objects-v2 --bucket "$BACKUP_BUCKET" --prefix "monthly/techaust-prod-finance-$month" --query "Contents[0].Key" --output text)"; then
            if [ -z "$listed" ] || [ "$listed" = "None" ]; then
              reason="no copy for $month in monthly/ yet"
            fi
          else
            echo "::warning::monthly/ could not be listed; this run makes the monthly copy so that no month is missed."
            reason="monthly/ could not be listed"
          fi
          if [ -n "$reason" ]; then
            echo "monthly=true" >> "$GITHUB_OUTPUT"
            echo "FINANCE=$RUNNER_TEMP/techaust-prod-finance-$month-$stamp.sql" >> "$GITHUB_ENV"
            echo "FINANCE_ARCHIVE=$RUNNER_TEMP/techaust-prod-finance-$month-$stamp.tar" >> "$GITHUB_ENV"
            echo "FINANCE_OBJECT=monthly/techaust-prod-finance-$month-$stamp.tar" >> "$GITHUB_ENV"
            echo "This run also makes the monthly finance-only copy for $month ($reason)."
          else
            echo "monthly=false" >> "$GITHUB_OUTPUT"
            echo "Daily copy only: the monthly copy for $month is in the bucket."
          fi
      # The finance-only SQL from the plaintext export (node:sqlite in memory; no package is installed or run; the script prints only a table count and a
      # size), then the same envelope. continue-on-error: a failure here must not stop the daily copy's upload below; the run's last check then fails it.
      - name: Build and encrypt the monthly finance-only copy
        id: monthly
        if: steps.when.outputs.monthly == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          umask 077
          node scripts/backup-monthly.mjs build "$DUMP" "$FINANCE"
          bash scripts/backup-encrypt.sh "$FINANCE" "$RUNNER_TEMP/backup-public.pem" "$FINANCE_ARCHIVE"
      # At once, and also when the export, an encryption or the monthly build failed: no plaintext (the export, the finance-only SQL) stays on the runner.
      - name: Delete the plaintexts
        if: always()
        run: |
          find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'techaust-prod-*.sql' -delete
          if find "$RUNNER_TEMP" -maxdepth 1 -type f -name 'techaust-prod-*.sql' | grep -q .; then
            echo "::error::A plaintext file could not be deleted."
            exit 1
          fi
          echo "Plaintext export (and finance-only SQL) deleted."
      - name: Upload the encrypted archive
        env:
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: aws s3 cp "$ARCHIVE" "s3://$BACKUP_BUCKET/$OBJECT" --only-show-errors --no-progress
      # The role can list daily/ but not read objects: the listed size must equal the archive's.
      - name: Check the uploaded object
        env:
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          local_bytes="$(wc -c < "$ARCHIVE" | tr -d ' ')"
          listed="$(aws s3api list-objects-v2 --bucket "$BACKUP_BUCKET" --prefix "$OBJECT" --query "Contents[?Key=='$OBJECT'].Size | [0]" --output text)"
          if [ "$listed" != "$local_bytes" ]; then
            echo "::error::$OBJECT is not in the bucket with $local_bytes bytes (listed: $listed)."
            exit 1
          fi
          {
            echo "### Production D1 backup"
            echo
            echo "- Object: \`$OBJECT\` ($local_bytes bytes)"
            echo "- Manifest:"
            echo
            echo '```json'
            tar -xOf "$ARCHIVE" manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Uploaded and checked: $OBJECT ($local_bytes bytes)."
      - name: Upload the monthly finance-only archive
        if: steps.monthly.outcome == 'success'
        env:
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: aws s3 cp "$FINANCE_ARCHIVE" "s3://$BACKUP_BUCKET/$FINANCE_OBJECT" --only-show-errors --no-progress
      # As for the daily copy: the role can list monthly/ but not read objects, so the listed size must equal the archive's.
      - name: Check the uploaded monthly object
        if: steps.monthly.outcome == 'success'
        env:
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          local_bytes="$(wc -c < "$FINANCE_ARCHIVE" | tr -d ' ')"
          listed="$(aws s3api list-objects-v2 --bucket "$BACKUP_BUCKET" --prefix "$FINANCE_OBJECT" --query "Contents[?Key=='$FINANCE_OBJECT'].Size | [0]" --output text)"
          if [ "$listed" != "$local_bytes" ]; then
            echo "::error::$FINANCE_OBJECT is not in the bucket with $local_bytes bytes (listed: $listed)."
            exit 1
          fi
          {
            echo
            echo "### Monthly finance-only copy (kept 10 years)"
            echo
            echo "- Object: \`$FINANCE_OBJECT\` ($local_bytes bytes)"
            echo "- Manifest:"
            echo
            echo '```json'
            tar -xOf "$FINANCE_ARCHIVE" manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Uploaded and checked: $FINANCE_OBJECT ($local_bytes bytes)."
      # The daily copy is in the bucket by now. A failed monthly copy still fails the run, so the owner sees it.
      - name: Fail the run when the monthly copy failed
        if: always() && steps.monthly.outcome == 'failure'
        run: |
          echo "::error::The monthly finance-only copy failed (see the step that builds it); nothing went to monthly/. The next night's run tries again while this month has no copy; to make it sooner, run this workflow by hand with monthly ticked."
          exit 1
      - name: Remove the archives and the public key file
        if: always()
        run: rm -f -- "${ARCHIVE:-}" "${FINANCE_ARCHIVE:-}" "$RUNNER_TEMP/backup-public.pem"

  # Decides whether this run backs up. A run by hand always does. A scheduled try is skipped when a run of this workflow started since
  # this backup night began at 20:30 UTC and its `backup` job's "Check the uploaded object" step succeeded, whatever the run's
  # conclusion: a night whose daily copy is in the bucket but whose monthly copy failed is not exported again (review 2026-11-08,
  # finding 3; the next night's run retries the monthly copy). So the 23:10 and 01:10 UTC tries skip after a good 21:10 run, while a
  # by-hand run in the afternoon never stands in for the night. Any answer it can't read means "back up" (never a missed night); so
  # does a gate that fails outright (the backup job's `if` skips only on "false"). No secret, no checkout, no package code: only the
  # run list of this workflow, read with the run's own token.
  gate:
    permissions:
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Has tonight's backup already been made
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ "$EVENT" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Started by hand: backing up."
            exit 0
          fi
          # The backup night starts at 20:30 UTC (02:00 IST): the three tries (21:10, 23:10 and 01:10 UTC) share it, however late GitHub
          # starts them. One reading of the clock; 73800 s = 20 h 30 min back lands on the night's start date.
          now="$(date -u +%s)"
          since="$(date -u -d "@$((now - 73800))" +%Y-%m-%d)T20:30:00Z"
          if ! ids="$(gh api --method GET "repos/$REPO/actions/workflows/backup.yml/runs" -f status=completed -f "created=>=$since" -f per_page=20 --jq '.workflow_runs[].id')"; then
            echo "::warning::The list of earlier backup runs could not be read; backing up anyway."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for id in $ids; do
            [ "$id" = "$RUN_ID" ] && continue
            if ! made="$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq '[.jobs[] | select(.name == "backup") | .steps[]? | select(.name == "Check the uploaded object" and .conclusion == "success")] | length')"; then
              echo "::warning::The jobs of run $id could not be read; backing up anyway."
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$made" -gt 0 ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Run $id uploaded and checked a daily copy since $since: this try is skipped."
              exit 0
            fi
          done
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "No daily copy since $since: backing up."
