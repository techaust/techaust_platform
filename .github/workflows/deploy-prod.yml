name: Deploy production
# PRODUCTION. Owner-only, manual, typed confirmation (docs/05-architecture.md §12.3, ADR 0009).
# Requires the repo variable PRODUCTION_ENABLED == 'true' (set by the owner at go-live).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "What to deploy: main, or a release tag (e.g. v2026.11.08-1)"
        required: true
        default: main
      confirm:
        description: "Type exactly: deploy techaust.com <tag>"
        required: true
      stage:
        description: "database: migrations and seed only (no Worker is deployed); full: migrations, seed, then the seven Workers"
        type: choice
        options: [full, database]
        default: full
      check_web:
        description: "Health-check the website after its deploy (false until techaust.com is attached to it)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

# P7 (docs/runs/p7-launch.md P7-B), on the shape of deploy-staging.yml (M7.5, owner's Q3 A 2026-11-01):
#   1. guard: only the owner (techaust), only while PRODUCTION_ENABLED is 'true', only with the typed confirmation, and only main or a v* tag (the
#      refs the `production` environment accepts the run from: started from main with "Use workflow from: main", or from a tag).
#   2. build: NO environment and NO secret (it installs and runs package code): the seed SQL, the production builds of the admin, the portal and the
#      website (CLOUDFLARE_ENV=production, with the SPA header and Worker budget checks and the website's dist checks), the pre-bundled jobs and
#      website Workers (dry runs: nothing is uploaded and no token is needed), no `.dev.vars` anywhere, and (stage full) the pre-production readiness
#      check, which reads every one of those bundles. Handed on as an artifact.
#   3. deploy: the `production` environment (CF_API_TOKEN_PROD and the owner's review) and nothing installed but wrangler (`@techaust/deploy-tools`, from
#      the lockfile). The artifact is downloaded outside the checkout and placed by scripts/place-build-artifact.mjs before any step with a secret (L57),
#      and every build is checked as a production one (scripts/deploy-worker.mjs production --check) before anything changes. Then: the D1 Time Travel
#      bookmark into the job summary (the restore point), the migrations, the seed (insert-only), and with stage full the seven Workers one per step
#      (admin API, admin invoices, admin finance, admin front, portal, jobs, website), each app followed by its health check (scripts/prod-health.mjs;
#      the website's only when check_web is true). A failed step stops the job, so no Worker is deployed after a failed one.
# No production config has a `routes` or custom-domain entry: the lead attaches the domains by hand, so a deploy never takes techaust.com.
# Only workflow_dispatch by the owner on this repository: never a fork's pull request (the repo is public).
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Owner, enablement and confirmation checks
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          ENABLED: ${{ vars.PRODUCTION_ENABLED }}
          TAG: ${{ inputs.tag }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          # actor is who started the run; triggering_actor is who started this attempt (a re-run by someone else).
          [ "$ACTOR" = "techaust" ] && [ "$TRIGGERING_ACTOR" = "techaust" ] || { echo "Only the owner (techaust) may deploy production."; exit 1; }
          [ "$ENABLED" = "true" ] || { echo "Production deploys are disabled (repo variable PRODUCTION_ENABLED is not true)."; exit 1; }
          [ "$CONFIRM" = "deploy techaust.com $TAG" ] || { echo "Confirmation text does not match."; exit 1; }
          # The same refs the `production` environment allows the run from (branch main, tags v*): what is built and deployed is one of them too.
          case "$TAG" in
            main|v*) ;;
            *) echo "Only main or a v* release tag may be deployed to production."; exit 1 ;;
          esac
          echo "Guards passed for $TAG"

  build:
    needs: guard
    # No environment and no secret: this job installs and runs package code. No `cache: pnpm` either (L51): a cache saved after package code ran could
    # be restored by the deploy job.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # P7 review M1: the commit this job builds; the deploy job checks out exactly this commit, never `inputs.tag` again (with `main`, a later merge
    # during the owner's approval wait would mix one commit's bundles with another's migrations and configs).
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      # The built commit, and (review L3) it must be on main: a `v*` branch or a tag off main is refused.
      - name: Record the built commit and check it is on main
        id: sha
        run: |
          sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha is not on main; nothing was built or changed."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # The seed is package code (packages/db): the settings defaults, the catalogue S1-S18, the templates and the terms; no sample data. Written here,
      # applied by the deploy job.
      - name: Write the seed SQL (no token)
        run: |
          mkdir -p .deploy
          pnpm --filter @techaust/db seed:sql "$GITHUB_WORKSPACE/.deploy/seed.sql"
      # CLOUDFLARE_ENV=production is set inside each build:production script, so the Vite plugin writes the redirected production deploy config
      # (.wrangler/deploy/config.json) and the pages and sign-in bundles carry production's keys (an empty production Turnstile key fails the build).
      - name: Build the admin (production, no token)
        run: pnpm --filter @techaust/admin run build:production
      - name: Build the portal (production, no token)
        run: pnpm --filter @techaust/portal run build:production
      # The website: robots.txt allows crawling and dist/_headers carries no X-Robots-Tag only in this build (scripts/web-noindex.mjs).
      - name: Build the website (production, no token)
        run: pnpm --filter @techaust/web run build:production
      - name: Bundle the jobs and website Workers (production, no token)
        run: |
          pnpm --filter @techaust/jobs exec wrangler deploy --dry-run --env production --outdir dist-production
          pnpm --filter @techaust/web exec wrangler deploy --dry-run --env production --outdir .wrangler/dist-production
      # M7.1 L17 / M7.5 F: no local secrets file (`.dev.vars`, `.dev.vars.*`) in any build output, the pre-bundled Workers included.
      - name: No .dev.vars in any build output
        run: node scripts/check-prod-build.mjs dev-vars
      # Pre-production check (M2.3, P7): blocks the deploy while an owner input is missing (postal address, founder's LinkedIn, headshot and bio,
      # unconfirmed aliases, the launch and legal effective dates, a Placeholder on a built page or in a bundle, noindex in dist/_headers, the backup
      # record, the production Turnstile keys) or while a Worker's production config differs from staging's in more than values. Run here only, never
      # by CI or the staging deploy. Not on stage database: that run deploys no Worker and no page, and comes before the backup it would wait for
      # (docs/runs/phase7-production.md, finding 4: migrations and seed first, then the backup and restore drill, then backup-verified.json).
      - name: Pre-production readiness (owner inputs and production configs)
        if: inputs.stage == 'full'
        run: node scripts/check-prod-readiness.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-build
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          path: |
            .deploy/seed.sql
            apps/admin/dist
            apps/admin/.wrangler/deploy
            apps/portal/dist
            apps/portal/.wrangler/deploy
            apps/web/dist
            apps/web/.wrangler/dist-production
            apps/jobs/dist-production

  deploy:
    needs: build
    # The `production` environment holds CF_API_TOKEN_PROD (an environment secret; no zone or DNS permission), a required reviewer (the owner) and
    # its deployment refs (branch main, tags v*). This is the only job with the token.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Wrangler alone, from the lockfile; the build arrives as an artifact.
      - name: Install wrangler only
        run: pnpm install --frozen-lockfile --filter @techaust/deploy-tools
      # L57: as in deploy-staging.yml, the artifact (written by a job that ran package code) is downloaded outside the checkout, and placed by a script
      # from the checkout, with no secret, before any step that holds one: only the build outputs the upload step names, no .env* or .dev.vars*, no
      # symlink, nothing over an existing file.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-build
          path: ${{ runner.temp }}/production-build
      - name: Place the build outputs (no secret)
        run: node scripts/place-build-artifact.mjs production "$RUNNER_TEMP/production-build"
      # Every production build checked before anything changes (no secret): the flattened configs (L51: no build step, nothing outside dist) name
      # the production Workers for env.production, and no output carries a staging host, name or Turnstile key (scripts/check-prod-build.mjs).
      - name: Check every build is a production one (no secret)
        run: node scripts/deploy-worker.mjs production --check
      - name: Check the production credentials are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CF_API_TOKEN_PROD (environment production) or CLOUDFLARE_ACCOUNT_ID is not set; nothing was changed."
            exit 1
          fi
      # The restore point (08 §6.3): the D1 Time Travel bookmark before the migrations, in the job summary, so a bad migration can be undone with
      # `wrangler d1 time-travel restore DB --env production --bookmark <bookmark>`.
      - name: Record the D1 Time Travel bookmark (production)
        working-directory: apps/jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # P7 review M2: a failed `time-travel info` must fail the step (tee alone would hide it), so no migration runs without a restore point.
          set -o pipefail
          node ../../tools/deploy/node_modules/wrangler/bin/wrangler.js d1 time-travel info DB --env production | tee "$RUNNER_TEMP/time-travel.txt"
          {
            echo "### Production D1 before this run's migrations"
            echo
            echo '```'
            cat "$RUNNER_TEMP/time-travel.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Migrations before any Worker deploys (owner decision M1.3), backward-compatible (docs/05 §5.5).
      - name: Migrate production D1
        working-directory: apps/jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../../tools/deploy/node_modules/wrangler/bin/wrangler.js d1 migrations apply DB --remote --env production
      # The seed: loaded by the first run; insert-only and idempotent (it never overwrites an edit), so a later run inserts nothing that exists.
      - name: Seed production D1
        working-directory: apps/jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ../../tools/deploy/node_modules/wrangler/bin/wrangler.js d1 execute DB --remote --env production --file ../../.deploy/seed.sql
      # Stage database stops here. The deploy order (from M6.5, owner's Q3 A 2026-11-02), as deploy-staging.yml: a Worker another binds deploys first.
      - name: Deploy 1 of 7, the admin API Worker (production)
        if: inputs.stage == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-worker.mjs production admin-api
      - name: Deploy 2 of 7, the admin invoices Worker (production)
        if: inputs.stage == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-worker.mjs production admin-invoices
      - name: Deploy 3 of 7, the admin finance Worker (production)
        if: inputs.stage == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-worker.mjs production admin-finance
      - name: Deploy 4 of 7, the admin front Worker (production)
        if: inputs.stage == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-worker.mjs production admin
      # The admin is behind Cloudflare Access with a bypass for its health path only, so only the front's /api/v1/health is read (no Access token).
      - name: Health check, the admin front Worker (production)
        if: inputs.stage == 'full'
        run: node scripts/prod-health.mjs admin
      - name: Deploy 5 of 7, the portal Worker (production)
        if: inputs.stage == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-worker.mjs production portal
      - name: Health check, the portal Worker (production)
        if: inputs.stage == 'full'
        run: node scripts/prod-health.mjs portal
      - name: Deploy 6 of 7, the jobs Worker (production)
        if: inputs.stage == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-worker.mjs production jobs
      - name: Health check, the jobs Worker (production)
        if: inputs.stage == 'full'
        run: node scripts/prod-health.mjs jobs
      - name: Deploy 7 of 7, the website Worker (production)
        if: inputs.stage == 'full'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-worker.mjs production web
      # The lead attaches techaust.com to the website by hand (no config holds a route or custom domain): until it is attached, run with check_web false.
      - name: Health check, the website Worker (production)
        if: inputs.stage == 'full' && inputs.check_web
        run: node scripts/prod-health.mjs web
