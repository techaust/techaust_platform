name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the browser tests and Lighthouse (M2.5) run in this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan
      - name: Secret scan (gitleaks, full git history)
        run: |
          # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's gitleaks_8.30.1_checksums.txt (checked
          # 2026-10-22). Bump the version and this hash together; the download is refused if they disagree.
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --no-banner --redact --verbose # --verbose prints rule, file, line and fingerprint (values stay redacted)
          rm -f gitleaks gitleaks.tgz
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # docs/08 §3.5 (full audit A1 3, owner's yes 2026-10-30): the pinned pnpm asks the registry the install already used for the
      # advisories of every package in the lockfile; any high or critical one fails the job unless a reviewed, dated entry in
      # scripts/dependency-audit-allow.json lets it through (expired, stale and malformed entries fail too). No secret is used.
      - name: Dependency audit (high and critical advisories, reviewed allow-list)
        run: node scripts/dependency-audit.mjs
      - name: Lint (Biome)
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck
      - name: Public Worker binding guard
        run: node scripts/check-web-bindings.mjs
      - name: Content lint (banned phrases, WEB-G-14)
        run: node scripts/web-content-lint.mjs
      - name: Worker config guard (preview URLs off)
        run: node scripts/check-worker-config.mjs
      - name: Migration rebuild guard (no migration rebuilds a referenced table)
        run: node scripts/check-migrations.mjs
      - name: Stylesheet clash guard (no class is a base rule in two stylesheets of one app)
        run: node scripts/css-collisions.mjs
      - name: Build (before the tests, which read the built site)
        run: pnpm build
      - name: Tests (unit + Workers runtime)
        run: pnpm test
      # M2.5 browser checks of the public site (WEB-G-09, WEB-G-13, NFR-1). They run on the built site (the Build step
      # above), serve it with `wrangler dev` (local mode, no Cloudflare login) and use only Cloudflare's public Turnstile
      # TEST keys. No secret is used, so this is safe on fork pull requests. Reports stay on the runner as workflow
      # artifacts (7 days): nothing is uploaded to Lighthouse's public storage or anywhere else.
      - name: Browser setup (Chromium for Playwright and Lighthouse; local-only dev secrets)
        run: |
          pnpm --filter @techaust/web exec playwright install --with-deps chromium
          pnpm dev:secrets
      - name: Browser tests (Playwright and axe, apps/web/e2e)
        run: pnpm --filter @techaust/web e2e
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Lighthouse CI (mobile, per template; performance 95, accessibility, best practices and SEO 100)
        run: pnpm --filter @techaust/web lhci
        env:
          WRANGLER_SEND_METRICS: "false"
      - name: Upload the Playwright report and Lighthouse reports (on the runner's workflow artifacts only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-browser-reports
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/.lighthouseci
          if-no-files-found: ignore
          retention-days: 7
      - name: Migrations match the Drizzle schema
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::packages/db/src/schema changed without a migration. Run 'pnpm db:generate' and commit it."
            git status --porcelain packages/db/migrations
            exit 1
          fi
