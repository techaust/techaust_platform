name: Deploy staging

# Auto-deploys main to the *.workers.dev staging Workers after CI passes.
# Skips cleanly until the owner adds the CF_API_TOKEN_STAGING and CLOUDFLARE_ACCOUNT_ID repo secrets (P5.7).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Only pushes to THIS repository's main branch; never fork pull requests (the repo is public).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check staging credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Staging secrets not configured yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # Owner decision (M1.3): staging D1 is migrated and seeded on every merge, before the Workers deploy, so
      # new code never runs against an old schema. Migrations are backward-compatible (docs/05 §5.5) and the
      # seed is insert-only (it never overwrites edits). Staging only: production D1 is a Phase 7 decision.
      - if: steps.creds.outputs.ready == 'true'
        name: Migrate and seed staging D1
        run: |
          pnpm --filter @techaust/jobs exec wrangler d1 migrations apply DB --remote --env staging
          pnpm --filter @techaust/db seed:sql "$RUNNER_TEMP/seed.sql"
          pnpm --filter @techaust/jobs exec wrangler d1 execute DB --remote --env staging --file "$RUNNER_TEMP/seed.sql"
      - if: steps.creds.outputs.ready == 'true'
        name: Deploy all Workers (staging)
        run: pnpm -r --workspace-concurrency=1 run deploy:staging
