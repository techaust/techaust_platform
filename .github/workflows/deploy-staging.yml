name: Deploy staging

# Auto-deploys main to the *.workers.dev staging Workers after CI passes.
# Skips cleanly until the owner adds the CF_API_TOKEN_STAGING and CLOUDFLARE_ACCOUNT_ID repo secrets (P5.7).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Only pushes to THIS repository's main branch; never fork pull requests (the repo is public).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The Cloudflare credentials are set only on the steps that use them (not job-wide). Full audit A1 5 (owner's yes 2026-10-30): every
    # step that runs package code (the install, the seed SQL, `astro build`, `vite build`) runs WITHOUT them; only the wrangler steps
    # (migrate, seed, snapshot read, deploy) and the credentials check get CLOUDFLARE_API_TOKEN. The deploy scripts first check that the
    # build they upload is a staging build (scripts/check-staging-build.mjs), since a plain build names the production Worker.
    # Limit: steps share the runner, so this keeps the token out of reach of package code while it runs, not out of reach of files a
    # malicious package could leave behind for a later step (docs/runbooks/environments.md).
    steps:
      - name: Check staging credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Staging secrets not configured yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # The deploy-check token (Access Part 4) must be set before anything is uploaded: without it the job would stop at the admin's
      # health check, after the admin's deploy, and leave staging half updated (workflow review, finding 1). Emptiness only.
      - if: steps.creds.outputs.ready == 'true'
        name: Check the deploy-check token is set
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_DEPLOY_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_DEPLOY_CLIENT_SECRET }}
        run: |
          if [ -z "$CF_ACCESS_CLIENT_ID" ] || [ -z "$CF_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::CF_ACCESS_DEPLOY_CLIENT_ID or CF_ACCESS_DEPLOY_CLIENT_SECRET is not set (docs/runbooks/access-staging.md Part 4); nothing was deployed."
            exit 1
          fi
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - if: steps.creds.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: steps.creds.outputs.ready == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.creds.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # The seed is package code (packages/db), so its SQL is written here, without the token; the next step only applies it.
      - if: steps.creds.outputs.ready == 'true'
        name: Write the seed SQL (no token)
        run: pnpm --filter @techaust/db seed:sql "$RUNNER_TEMP/seed.sql"
      # Owner decision (M1.3): staging D1 is migrated and seeded on every merge, before the Workers deploy, so
      # new code never runs against an old schema. Migrations are backward-compatible (docs/05 §5.5) and the
      # seed is insert-only (it never overwrites edits). Staging only: production D1 is a Phase 7 decision.
      - if: steps.creds.outputs.ready == 'true'
        name: Migrate and seed staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm --filter @techaust/jobs exec wrangler d1 migrations apply DB --remote --env staging
          pnpm --filter @techaust/jobs exec wrangler d1 execute DB --remote --env staging --file "$RUNNER_TEMP/seed.sql"
      # ADM-CAT-05: the website is built from the newest PUBLISHED catalogue snapshot (admin: Catalogue, Publish). No snapshot yet means no
      # file, so the web build uses the seed. If a snapshot exists and the fetch fails, this step fails the job: the staging site never
      # silently falls back to stale seed prices. The same script runs in publish-catalogue.yml. It only runs `wrangler d1 execute`.
      - if: steps.creds.outputs.ready == 'true'
        name: Fetch the published catalogue snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/fetch-catalogue-snapshot.mjs --out apps/web/catalogue-snapshot.json
      # The builds (A1 5): no token. CLOUDFLARE_ENV=staging is set inside each build:staging script, so the Vite plugin writes the
      # redirected staging deploy config (.wrangler/deploy/config.json) that the deploy steps upload, and the pages carry staging's keys.
      - if: steps.creds.outputs.ready == 'true'
        name: Build the admin (staging, no token)
        run: pnpm --filter @techaust/admin run build:staging
      - if: steps.creds.outputs.ready == 'true'
        name: Build the portal (staging, no token)
        run: pnpm --filter @techaust/portal run build:staging
      - if: steps.creds.outputs.ready == 'true'
        name: Build the website (staging, no token)
        run: pnpm --filter @techaust/web run build:staging
      # The deploy order (full audit A6 8, owner's yes 2026-10-30), one Worker per step: the admin API first (the admin front binds it as
      # ADMIN_API), then the admin finance Worker (M6.1, owner's yes 2026-10-31: the front binds it as ADMIN_FINANCE, and jobs binds its
      # BillingJobs entrypoint as ADMIN_JOBS), then the admin front, the portal, jobs and the website.
      # A failed step stops the job, so no Worker is deployed after a failed one. After each app, a health check through Cloudflare
      # Access with the deploy-check service token (scripts/staging-health.mjs; `staging-deploy-check`, a Service Auth policy on all
      # four staging apps, owner 2026-10-30; docs/runbooks/access-staging.md Part 4).
      - if: steps.creds.outputs.ready == 'true'
        name: Deploy 1 of 6, the admin API Worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @techaust/admin run deploy:staging:api
      - if: steps.creds.outputs.ready == 'true'
        name: Deploy 2 of 6, the admin finance Worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @techaust/admin run deploy:staging:finance
      - if: steps.creds.outputs.ready == 'true'
        name: Deploy 3 of 6, the admin front Worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @techaust/admin run deploy:staging:front
      # The front's /api/v1/health; a signed-out /api/v1/leads answered 401 by the API Worker and a signed-out /api/v1/dashboard answered
      # 401 by the finance Worker, each through its binding (not 502).
      - if: steps.creds.outputs.ready == 'true'
        name: Health check, the admin front, API and finance Workers (staging)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_DEPLOY_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_DEPLOY_CLIENT_SECRET }}
        run: node scripts/staging-health.mjs admin
      - if: steps.creds.outputs.ready == 'true'
        name: Deploy 4 of 6, the portal Worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @techaust/portal run deploy:staging
      - if: steps.creds.outputs.ready == 'true'
        name: Health check, the portal Worker (staging)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_DEPLOY_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_DEPLOY_CLIENT_SECRET }}
        run: node scripts/staging-health.mjs portal
      - if: steps.creds.outputs.ready == 'true'
        name: Deploy 5 of 6, the jobs Worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @techaust/jobs run deploy:staging
      - if: steps.creds.outputs.ready == 'true'
        name: Health check, the jobs Worker (staging)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_DEPLOY_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_DEPLOY_CLIENT_SECRET }}
        run: node scripts/staging-health.mjs jobs
      - if: steps.creds.outputs.ready == 'true'
        name: Deploy 6 of 6, the website Worker (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @techaust/web run deploy:staging
      - if: steps.creds.outputs.ready == 'true'
        name: Health check, the website Worker (staging)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_DEPLOY_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_DEPLOY_CLIENT_SECRET }}
        run: node scripts/staging-health.mjs web
